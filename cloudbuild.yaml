steps:
  # Gate deployment on deterministic turn-taking and transcript-policy tests.
  - name: 'python:3.11-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'pip install --quiet --no-cache-dir -r requirements-dev.txt && pytest -q'

  # Do not promote an orchestrator that cannot reach its configured warm RAG
  # service.  The health endpoint is intentionally public and read-only; the
  # authenticated /warm route is exercised by the runtime smoke test.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        curl --fail --silent --show-error "${_RAG_BACKEND_URL}/health" | grep -q '"status":"ok"'

  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/spiked-ai-liveavatar:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/spiked-ai-liveavatar:latest',
      '.'
    ]

  # Push the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/spiked-ai-liveavatar:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/spiked-ai-liveavatar:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'spiked-ai-liveavatar'
      - '--image'
      - 'gcr.io/$PROJECT_ID/spiked-ai-liveavatar:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--max-instances'
      # Run/control state is intentionally in memory; keep one instance so Recall audio
      # and the avatar control socket cannot land on different workers.
      - '1'
      - '--set-env-vars'
      # Everything else this service reads now has a correct prod default
      # baked into live_avatar.py — only the values that legitimately vary
      # per deploy (a non-default avatar id, a different bot name) belong here.
      # RECALL_BASE_URL is explicit here on purpose: live_avatar.py's own
      # default is "ap-northeast-1", which 401s if RECALL_API_KEY is actually
      # a default-region key (Recall's own default, us-west-2) instead —
      # confirmed this deploy's key is the latter. Verify against whichever
      # region RECALL_API_KEY's Recall.ai workspace actually is before
      # trusting this value; update both together if the key ever changes.
      - 'LIVEAVATAR_AVATAR_ID=9650a758-1085-4d49-8bf3-f347565ec229,BOT_NAME=Tom,LIVEAVATAR_API_URL=https://api.liveavatar.com,LIVEAVATAR_SANDBOX=false,DEFAULT_VIDEO_PROVIDER=liveavatar,DEFAULT_ANSWER_ENGINE=spiked,GEMINI_MODEL=gemini-3.5-flash-lite,PUBLIC_BASE_URL=https://spiked-ai-liveavatar-409019309412.us-central1.run.app,SCREEN_SHARE_ASSET_BASE_URL=https://spiked.ai,RECALL_BASE_URL=https://us-west-2.recall.ai,RAG_BACKEND_URL=${_RAG_BACKEND_URL},MCP_SERVER_URL=${_MCP_SERVER_URL}'
      - '--set-secrets'
      - 'DEEPGRAM_API=projects/409019309412/secrets/DEEPGRAM_API:latest,LIVEAVATAR_API_KEY=projects/409019309412/secrets/LIVEAVATAR_API_KEY:latest,RECALL_API_KEY=projects/409019309412/secrets/RECALL_API_KEY:latest,GEMINI_API_KEY=projects/409019309412/secrets/GEMINI_API_KEY:latest,SUPABASE_KEY=projects/409019309412/secrets/SUPABASE_KEY_TRANSCRIPT:latest,SUPABASE_URL=projects/409019309412/secrets/SUPABASE_URL_TRANSCRIPT:latest'

images:
  - 'gcr.io/$PROJECT_ID/spiked-ai-liveavatar:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/spiked-ai-liveavatar:latest'

# Keep these explicit even while the legacy backend remains the safe default.
# Promotion can override them with:
#   --substitutions=_RAG_BACKEND_URL=<warm-service-url>,_MCP_SERVER_URL=<mcp-url>
substitutions:
  _RAG_BACKEND_URL: 'https://feat-fastembeddings-465168042653.us-central1.run.app'
  _MCP_SERVER_URL: ''

options:
  logging: CLOUD_LOGGING_ONLY
