steps:
  # Gate deployment on deterministic turn-taking and transcript-policy tests.
  - name: 'python:3.11-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'pip install --quiet --no-cache-dir -r requirements-dev.txt && pytest -q'

  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/spiked-ai-liveavatar:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/spiked-ai-liveavatar:latest',
      '.'
    ]

  # Push the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/spiked-ai-liveavatar:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/spiked-ai-liveavatar:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'spiked-ai-liveavatar'
      - '--image'
      - 'gcr.io/$PROJECT_ID/spiked-ai-liveavatar:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--max-instances'
      # Run/control state is intentionally in memory; keep one instance so Recall audio
      # and the avatar control socket cannot land on different workers.
      - '1'
      - '--set-env-vars'
      - 'SPIKED_BACKEND_URL=https://spikedai-production-application-409019309412.us-central1.run.app,RECALL_WEBHOOK_URL=https://recall-backend-production-409019309412.us-central1.run.app/webhook/recall/transcript,LIVEAVATAR_API_URL=https://api.liveavatar.com,LIVEAVATAR_AVATAR_ID=69cf601f-b35b-4d1b-a701-c854d223b5a5,BOT_NAME=Tom,GEMINI_MODEL=gemini-3.5-flash-lite,PUBLIC_BASE_URL=https://spiked-ai-liveavatar-409019309412.us-central1.run.app,AGENT_BARGE_IN_MS=700,AGENT_MAX_REPLY_WORDS=45'
      - '--set-secrets'
      - 'DEEPGRAM_API=projects/409019309412/secrets/DEEPGRAM_API:latest,LIVEAVATAR_API_KEY=projects/409019309412/secrets/LIVEAVATAR_API_KEY:latest,RECALL_API_KEY=projects/409019309412/secrets/RECALL_API_KEY:latest,GEMINI_API_KEY=projects/409019309412/secrets/GEMINI_API_KEY:latest,SUPABASE_KEY=projects/409019309412/secrets/SUPABASE_KEY_TRANSCRIPT:latest,SUPABASE_URL=projects/409019309412/secrets/SUPABASE_URL_TRANSCRIPT:latest'

images:
  - 'gcr.io/$PROJECT_ID/spiked-ai-liveavatar:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/spiked-ai-liveavatar:latest'

options:
  logging: CLOUD_LOGGING_ONLY
