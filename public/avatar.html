<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpikedAI Live Avatar</title>
  <!-- Vendor SDKs are loaded on demand by the provider module the backend
       names, so a Simli page never downloads LiveKit and vice versa. -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      display: block;
    }
    #status-overlay {
      position: absolute;
      bottom: 12px;
      left: 12px;
      padding: 6px 12px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      color: #94a3b8;
      font-size: 11px;
      letter-spacing: 0.5px;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #eab308;
    }
    .status-dot.active {
      background-color: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .status-dot.error {
      background-color: #ef4444;
    }
    /* Debug overlay: what the agent heard and how the gate ruled on it.
       Rendered into the meeting camera feed, so it is opt-in via ?debug=1. */
    #heard-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      max-height: 45vh;
      overflow: hidden;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      font-size: 13px;
      line-height: 1.45;
      z-index: 20;
      display: none;
      flex-direction: column;
      gap: 6px;
    }
    #heard-overlay.visible {
      display: flex;
    }
    #heard-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
    }
    .heard-line {
      display: flex;
      gap: 8px;
      align-items: baseline;
    }
    .heard-speaker {
      color: #38bdf8;
      font-weight: 600;
      white-space: nowrap;
    }
    .heard-text {
      flex: 1;
      word-break: break-word;
    }
    .heard-verdict {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      background: rgba(148, 163, 184, 0.18);
      color: #94a3b8;
    }
    .heard-verdict.reply {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }
    .heard-verdict.blocked {
      background: rgba(239, 68, 68, 0.18);
      color: #f87171;
    }
    /* "Tom, stay quiet for 30 seconds" — a countdown ring bottom-center of
       the actual meeting video feed, visible to everyone in the call, not
       just the rep's console. */
    #mute-overlay {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 30;
    }
    #mute-overlay.visible {
      display: flex;
    }
    #mute-ring {
      width: 64px;
      height: 64px;
      transform: rotate(-90deg);
    }
    #mute-ring-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.15);
      stroke-width: 5;
    }
    #mute-ring-progress {
      fill: none;
      stroke: #38bdf8;
      stroke-width: 5;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.2s linear;
    }
    #mute-count {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 15px;
      font-weight: 600;
      color: #e2e8f0;
    }
    #mute-ring-wrap {
      position: relative;
      width: 64px;
      height: 64px;
    }
    #mute-label {
      padding: 3px 10px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      font-size: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="avatar-video" autoplay playsinline muted></video>
    <div id="heard-overlay">
      <div id="heard-title">Heard this turn</div>
      <div id="heard-lines"></div>
    </div>
    <div id="status-overlay">
      <div id="status-dot" class="status-dot"></div>
      <span id="status-text">Initializing SpikedAI Live Avatar...</span>
    </div>
    <div id="mute-overlay">
      <div id="mute-ring-wrap">
        <svg id="mute-ring" viewBox="0 0 64 64">
          <circle id="mute-ring-bg" cx="32" cy="32" r="28"></circle>
          <circle id="mute-ring-progress" cx="32" cy="32" r="28"></circle>
        </svg>
        <div id="mute-count">0</div>
      </div>
      <div id="mute-label">Staying quiet</div>
    </div>
  </div>

  <!-- type=module: avatar.js dynamically imports its provider. -->
  <script type="module" src="/avatar.js"></script>
</body>
</html>
